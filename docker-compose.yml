# Banco de dados do projeto. Para ligar: docker compose up -d
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: observatorio
    ports:
      # Porta no seu computador. Se já tem um MySQL instalado na 3306, use outra:
      # MYSQL_PORTA=3307 docker compose up -d   (e use a mesma porta no backend/.env)
      - "${MYSQL_PORTA:-3306}:3306"
    volumes:
      - mysql-dados:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 20

volumes:
  mysql-dados: