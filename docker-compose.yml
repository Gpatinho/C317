# Containers do projeto. Na raiz, com o Docker Desktop aberto:
#   Tudo (MySQL + API + site):                     docker compose --profile completo up -d --build
#   MySQL + API (para mexer no front com npm run dev): docker compose up -d --build api
#   Só o MySQL (para mexer na API com npm run dev):    docker compose up -d
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: observatorio
    ports:
      # Porta no seu computador. Se já tem um MySQL instalado na 3306, use outra:
      # MYSQL_PORTA=3307 docker compose up -d   (e use a mesma porta no backend/.env)
      - "${MYSQL_PORTA:-3306}:3306"
    volumes:
      - mysql-dados:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 20

  # API em container (perfil "completo"): igual ao que roda em produção.
  # Não liga no "docker compose up -d" simples, para não brigar pela porta 3333
  # com quem roda a API pelo npm run dev. Para ligar só ela: docker compose up -d api
  api:
    profiles: ["completo"]
    build: ./backend
    environment:
      DATABASE_URL: mysql://root:root@mysql:3306/observatorio
      # Segredo só para rodar localmente. Em produção, gere um próprio (veja docs/deploy.md).
      JWT_SECRET: ${JWT_SECRET:-segredo-local-de-desenvolvimento-nao-usar-em-producao}
      FRONTEND_URL: http://localhost:3000
      RODAR_SEED: "true"
    ports:
      - "3333:3333"
    volumes:
      - uploads:/app/uploads   # PDFs dos relatórios sobrevivem a rebuilds do container
    depends_on:
      mysql:
        condition: service_healthy

  # Site (perfil "completo"), na porta 3000. A API_URL é a que o NAVEGADOR chama,
  # por isso aponta para localhost:3333 (a porta da API no seu computador).
  front:
    profiles: ["completo"]
    build:
      context: ./front
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3333/api
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql-dados:
  uploads:
